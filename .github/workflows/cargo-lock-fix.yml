name: One-shot Cargo lockfile

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/cargo-lock-fix.yml

permissions:
  contents: write

jobs:
  lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1
      - name: Generate Cargo.lock
        run: cargo +1.98.1 generate-lockfile
      - name: Commit lockfile
        run: |
          if git diff --quiet -- Cargo.lock; then
            echo "Cargo.lock already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.lock
          git commit -m "chore: lock Rust dependencies"
          git push
