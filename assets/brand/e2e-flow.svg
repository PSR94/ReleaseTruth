<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">ReleaseTruth End-to-End Behavioral Compatibility Flow</title><desc id="desc">End-to-end process from configuration and capture through deterministic comparison, release gating, persistence, dashboard evidence and CI artifacts.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1600" y2="900"><stop stop-color="#07101f"/><stop offset="1" stop-color="#0b1f36"/></linearGradient></defs><rect width="1600" height="900" rx="28" fill="url(#bg)"/>
<text x="68" y="70" fill="#f8fafc" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="42" font-weight="800">ReleaseTruth End-to-End Compatibility Flow</text>
<text x="68" y="104" fill="#8fb4ce" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18">From a real release candidate to an evidence-backed compatibility decision</text>
<g font-family="Inter,Segoe UI,Arial,sans-serif">
  <g transform="translate(70 155)"><circle cx="28" cy="28" r="28" fill="#0ea5e9"/><text x="28" y="36" text-anchor="middle" fill="#fff" font-size="22" font-weight="800">1</text><rect x="60" width="245" height="92" rx="16" fill="#102a42" stroke="#2585d8"/><text x="80" y="36" fill="#fff" font-size="21" font-weight="700">Load config</text><text x="80" y="64" fill="#9db8ca" font-size="14">scenarios, normalization, gates</text></g>
  <g transform="translate(390 155)"><circle cx="28" cy="28" r="28" fill="#0ea5e9"/><text x="28" y="36" text-anchor="middle" fill="#fff" font-size="22" font-weight="800">2</text><rect x="60" width="245" height="92" rx="16" fill="#102a42" stroke="#2585d8"/><text x="80" y="36" fill="#fff" font-size="21" font-weight="700">Start targets</text><text x="80" y="64" fill="#9db8ca" font-size="14">base + candidate release</text></g>
  <g transform="translate(710 155)"><circle cx="28" cy="28" r="28" fill="#0ea5e9"/><text x="28" y="36" text-anchor="middle" fill="#fff" font-size="22" font-weight="800">3</text><rect x="60" width="245" height="92" rx="16" fill="#102a42" stroke="#2585d8"/><text x="80" y="36" fill="#fff" font-size="21" font-weight="700">Capture 6 surfaces</text><text x="80" y="64" fill="#9db8ca" font-size="14">API, browser, a11y, CLI, events, perf</text></g>
  <g transform="translate(1030 155)"><circle cx="28" cy="28" r="28" fill="#0ea5e9"/><text x="28" y="36" text-anchor="middle" fill="#fff" font-size="22" font-weight="800">4</text><rect x="60" width="245" height="92" rx="16" fill="#102a42" stroke="#2585d8"/><text x="80" y="36" fill="#fff" font-size="21" font-weight="700">Write draft evidence</text><text x="80" y="64" fill="#9db8ca" font-size="14">observations + evidence refs</text></g>
  <path d="M375 201h15M695 201h15M1015 201h15" stroke="#22d3ee" stroke-width="4"/>
  <path d="M1345 202h80v120H160" fill="none" stroke="#22d3ee" stroke-width="4" stroke-linecap="round"/>
  <g transform="translate(70 330)"><circle cx="28" cy="28" r="28" fill="#0ea5e9"/><text x="28" y="36" text-anchor="middle" fill="#fff" font-size="22" font-weight="800">5</text><rect x="60" width="245" height="92" rx="16" fill="#102a42" stroke="#2585d8"/><text x="80" y="36" fill="#fff" font-size="21" font-weight="700">Normalize</text><text x="80" y="64" fill="#9db8ca" font-size="14">remove volatility conservatively</text></g>
  <g transform="translate(390 330)"><circle cx="28" cy="28" r="28" fill="#0ea5e9"/><text x="28" y="36" text-anchor="middle" fill="#fff" font-size="22" font-weight="800">6</text><rect x="60" width="245" height="92" rx="16" fill="#102a42" stroke="#2585d8"/><text x="80" y="36" fill="#fff" font-size="21" font-weight="700">Canonicalize</text><text x="80" y="64" fill="#9db8ca" font-size="14">stable keys + ordering</text></g>
  <g transform="translate(710 330)"><circle cx="28" cy="28" r="28" fill="#0ea5e9"/><text x="28" y="36" text-anchor="middle" fill="#fff" font-size="22" font-weight="800">7</text><rect x="60" width="245" height="92" rx="16" fill="#102a42" stroke="#2585d8"/><text x="80" y="36" fill="#fff" font-size="21" font-weight="700">Fingerprint</text><text x="80" y="64" fill="#9db8ca" font-size="14">write behavior.lock.json</text></g>
  <g transform="translate(1030 330)"><circle cx="28" cy="28" r="28" fill="#0ea5e9"/><text x="28" y="36" text-anchor="middle" fill="#fff" font-size="22" font-weight="800">8</text><rect x="60" width="245" height="92" rx="16" fill="#102a42" stroke="#2585d8"/><text x="80" y="36" fill="#fff" font-size="21" font-weight="700">Compare releases</text><text x="80" y="64" fill="#9db8ca" font-size="14">stable diff + change IDs</text></g>
  <path d="M375 376h15M695 376h15M1015 376h15" stroke="#22d3ee" stroke-width="4"/>
  <g transform="translate(160 520)"><circle cx="28" cy="28" r="28" fill="#0ea5e9"/><text x="28" y="36" text-anchor="middle" fill="#fff" font-size="22" font-weight="800">9</text><rect x="60" width="250" height="92" rx="16" fill="#102a42" stroke="#2585d8"/><text x="80" y="36" fill="#fff" font-size="21" font-weight="700">Classify + score</text><text x="80" y="64" fill="#9db8ca" font-size="14">expected · minor · significant · breaking</text></g>
  <path d="M480 566h55" stroke="#22d3ee" stroke-width="4"/>
  <g transform="translate(555 492)"><path d="M110 0 220 74 110 148 0 74Z" fill="#102a42" stroke="#fbbf24" stroke-width="2"/><text x="110" y="62" text-anchor="middle" fill="#fff" font-size="20" font-weight="800">Gate reached?</text><text x="110" y="90" text-anchor="middle" fill="#fcd34d" font-size="14">configured fail-on threshold</text></g>
  <path d="M775 566h75" stroke="#22d3ee" stroke-width="4"/>
  <g transform="translate(870 500)"><rect width="225" height="74" rx="15" fill="#0a3329" stroke="#34d399"/><text x="20" y="31" fill="#6ee7b7" font-size="19" font-weight="800">PASS</text><text x="20" y="55" fill="#c0e9dc" font-size="14">no change reaches gate</text></g>
  <g transform="translate(870 592)"><rect width="225" height="74" rx="15" fill="#3a1822" stroke="#fb7185"/><text x="20" y="31" fill="#fda4af" font-size="19" font-weight="800">FAIL</text><text x="20" y="55" fill="#f3c1c9" font-size="14">exit 2 · release blocked</text></g>
  <path d="M775 603h55v26h40" fill="none" stroke="#fb7185" stroke-width="3"/>
  <g transform="translate(1180 488)"><rect width="345" height="190" rx="20" fill="#0d2035" stroke="#22d3ee"/><text x="24" y="38" fill="#67e8f9" font-size="18" font-weight="800">10–12 · OUTPUTS</text><text x="24" y="78" fill="#fff" font-size="19" font-weight="700">Reports</text><text x="145" y="78" fill="#9db8ca" font-size="14">JSON · MD · JUnit · SARIF · HTML</text><text x="24" y="115" fill="#fff" font-size="19" font-weight="700">Persist</text><text x="145" y="115" fill="#9db8ca" font-size="14">API + SQLite/PostgreSQL</text><text x="24" y="152" fill="#fff" font-size="19" font-weight="700">Visualize</text><text x="145" y="152" fill="#9db8ca" font-size="14">dashboard + evidence screenshots</text></g>
  <rect x="155" y="736" width="1290" height="72" rx="18" fill="#0c253a" stroke="#1f668c"/><text x="800" y="766" text-anchor="middle" fill="#67e8f9" font-size="17" font-weight="800">INVARIANT</text><text x="800" y="792" text-anchor="middle" fill="#d7e8f3" font-size="17">Only deterministic evidence and configured rules determine the compatibility verdict. AI never decides pass/fail.</text>
</g>
</svg>
