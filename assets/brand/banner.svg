<svg width="1600" height="500" viewBox="0 0 1600 500" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc"><title id="title">ReleaseTruth banner</title><desc id="desc">ReleaseTruth banner showing deterministic behavioral compatibility across API, browser, accessibility, CLI, events, and performance.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1600" y2="500" gradientUnits="userSpaceOnUse"><stop stop-color="#0B1220"/><stop offset="1" stop-color="#111C33"/></linearGradient><linearGradient id="accent" x1="230" y1="90" x2="650" y2="430" gradientUnits="userSpaceOnUse"><stop stop-color="#38BDF8"/><stop offset="1" stop-color="#818CF8"/></linearGradient><linearGradient id="chip" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#13233F"/><stop offset="1" stop-color="#0F1B31"/></linearGradient><filter id="shadow" x="0" y="0" width="200%" height="200%"><feDropShadow dx="0" dy="10" stdDeviation="20" flood-color="#020617" flood-opacity="0.35"/></filter></defs><rect width="1600" height="500" rx="28" fill="url(#bg)"/><circle cx="1380" cy="90" r="180" fill="#1E293B" opacity="0.18"/><circle cx="1220" cy="440" r="220" fill="#0F172A" opacity="0.24"/><g filter="url(#shadow)"><rect x="82" y="86" width="520" height="328" rx="28" fill="#0F172A" stroke="#1E293B"/><rect x="110" y="118" width="300" height="14" rx="7" fill="#38BDF8" opacity="0.9"/><rect x="110" y="153" width="220" height="10" rx="5" fill="#64748B"/><rect x="110" y="182" width="350" height="10" rx="5" fill="#334155"/><rect x="110" y="214" width="460" height="150" rx="22" fill="#020617" stroke="#1E293B"/><path d="M150 314 L220 250 L290 286 L365 230 L438 274 L514 206" stroke="url(#accent)" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/><circle cx="150" cy="314" r="8" fill="#38BDF8"/><circle cx="220" cy="250" r="8" fill="#38BDF8"/><circle cx="290" cy="286" r="8" fill="#38BDF8"/><circle cx="365" cy="230" r="8" fill="#38BDF8"/><circle cx="438" cy="274" r="8" fill="#38BDF8"/><circle cx="514" cy="206" r="8" fill="#818CF8"/></g><g><rect x="650" y="110" width="136" height="48" rx="24" fill="#082F49" stroke="#38BDF8"/><text x="718" y="141" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="20" font-weight="700" fill="#E0F2FE">v0.1.0</text><text x="650" y="220" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="62" font-weight="800" fill="#F8FAFC">ReleaseTruth</text><text x="650" y="268" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="28" font-weight="500" fill="#CBD5E1">Evidence-first behavioral compatibility for real releases</text><text x="650" y="324" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="22" font-weight="400" fill="#94A3B8">Capture → Normalize → Fingerprint → Compare → Persist → Visualize</text><g transform="translate(650 360)"><rect x="0" y="0" width="106" height="38" rx="19" fill="url(#chip)" stroke="#1E3A5F"/><text x="53" y="25" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="600" fill="#E2E8F0">API</text><rect x="118" y="0" width="126" height="38" rx="19" fill="url(#chip)" stroke="#1E3A5F"/><text x="181" y="25" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="600" fill="#E2E8F0">Browser</text><rect x="256" y="0" width="170" height="38" rx="19" fill="url(#chip)" stroke="#1E3A5F"/><text x="341" y="25" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="600" fill="#E2E8F0">Accessibility</text><rect x="438" y="0" width="98" height="38" rx="19" fill="url(#chip)" stroke="#1E3A5F"/><text x="487" y="25" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="600" fill="#E2E8F0">CLI</text><rect x="548" y="0" width="118" height="38" rx="19" fill="url(#chip)" stroke="#1E3A5F"/><text x="607" y="25" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="600" fill="#E2E8F0">